# Bigger model for faster quality gains — ~50M params.
dataset: "roneneldan/TinyStories"
max_seq_len: 128
text_column: "text"
val_split: 0.005
streaming: false
max_samples: null

tokenizer_name: "bert-base-uncased"
mask_token: "[MASK]"

model:
  vocab_size: 30522
  d_model: 512
  num_layers: 8
  num_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 128
  tie_weights: true

diffusion:
  T: 1000
  schedule: "cosine"
  inference_steps: 64
  sampling_mode: "random"
  temperature: 1.0
  top_k: 40

training:
  batch_size: 24
  gradient_accumulation_steps: 6
  max_steps: 50000
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 2000
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  eval_every: 2500
  save_every: 5000
  num_workers: 4
  seed: 42

checkpoint_dir: "./checkpoints_big"
