# Smoke test config — tiny model, small data, few steps.
dataset: "roneneldan/TinyStories"
max_seq_len: 64
text_column: "text"
val_split: 0.1
streaming: true
max_samples: 1000

tokenizer_name: "bert-base-uncased"
mask_token: "[MASK]"

model:
  vocab_size: 30522
  d_model: 64
  num_layers: 2
  num_heads: 2
  d_ff: 128
  dropout: 0.1
  max_seq_len: 64
  tie_weights: true

diffusion:
  T: 100
  schedule: "cosine"
  inference_steps: 8
  sampling_mode: "confidence"
  temperature: 1.0
  top_k: 10

training:
  batch_size: 8
  gradient_accumulation_steps: 1
  max_steps: 20
  learning_rate: 1.0e-3
  weight_decay: 0.01
  warmup_steps: 5
  max_grad_norm: 1.0
  mixed_precision: "fp32"
  eval_every: 10
  save_every: 20
  num_workers: 0
  seed: 42

checkpoint_dir: "./checkpoints_smoke"
