# Ultimate config: bigger model, longer training, best quality.
dataset: "roneneldan/TinyStories"
max_seq_len: 128
text_column: "text"
val_split: 0.005
streaming: false
max_samples: null

tokenizer_name: "bert-base-uncased"
mask_token: "[MASK]"

model:
  vocab_size: 30522
  d_model: 768
  num_layers: 12
  num_heads: 12
  d_ff: 3072
  dropout: 0.1
  max_seq_len: 128
  tie_weights: true

diffusion:
  T: 100
  schedule: "cosine"
  inference_steps: 32
  sampling_mode: "random"
  temperature: 0.7      # slightly lower for cleaner output
  top_k: 50             # slightly higher for more variety

training:
  batch_size: 32
  gradient_accumulation_steps: 4
  max_steps: 75000
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 3000
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  eval_every: 2500
  save_every: 5000
  num_workers: 4        # used for tokenization; set to 0 if MPS/dataloader unstable
  seed: 42

checkpoint_dir: "./checkpoints_ultimate"
