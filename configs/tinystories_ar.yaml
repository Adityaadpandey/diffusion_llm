# Autoregressive baseline for src/ar_baseline.py. Same data, size, optimiser and
# lr curve as tinystories_fast.yaml, so only the modelling direction differs.
dataset: "roneneldan/TinyStories"
max_seq_len: 128
text_column: "text"
val_split: 0.005
streaming: false
max_samples: null

tokenizer_name: "bert-base-uncased"

model:
  vocab_size: 30522
  d_model: 512
  num_layers: 8
  num_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 128
  tie_weights: true

training:
  batch_size: 24
  gradient_accumulation_steps: 6
  max_steps: 15000
  lr_schedule_steps: 300000
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 12000
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  eval_every: 2500
  save_every: 5000
  num_workers: 4
  seed: 42

checkpoint_dir: "./checkpoints_ar"
