# Test: train on all positions with the bigger model.
dataset: "roneneldan/TinyStories"
max_seq_len: 128
text_column: "text"
val_split: 0.05
streaming: false
max_samples: 10000

tokenizer_name: "bert-base-uncased"
mask_token: "[MASK]"

model:
  vocab_size: 30522
  d_model: 512
  num_layers: 8
  num_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 128
  tie_weights: true

diffusion:
  T: 1000
  schedule: "cosine"
  inference_steps: 64
  sampling_mode: "random"
  temperature: 1.0
  top_k: 40

training:
  batch_size: 16
  gradient_accumulation_steps: 4
  max_steps: 1000
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  max_grad_norm: 1.0
  mixed_precision: "bf16"
  eval_every: 250
  save_every: 1000
  num_workers: 4
  seed: 42

checkpoint_dir: "./checkpoints_allpos_test"
